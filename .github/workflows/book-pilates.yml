name: Book Saturday Pilates class

on:
  schedule:
    # GitHub cron fires late — sometimes by 60-90+ minutes — so start hours
    # early and let the script sleep until exactly 11:00 a.m. Toronto time.
    #   12:30 UTC = 8:30 EDT / 7:30 EST
    #   13:30 UTC = 9:30 EDT / 8:30 EST  (staggered backup)
    # The concurrency group serializes them: the backup starts only after the
    # primary finishes, sees the date already booked, and exits.
    - cron: "30 12 * * 4"
    - cron: "30 13 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (stop before the final booking click)"
        type: boolean
        default: true
      wait_for_release:
        description: "Wait for Thursday 11:00 ET before booking"
        type: boolean
        default: false

concurrency:
  group: book-pilates
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Book the class
        env:
          PILATES_EMAIL: ${{ secrets.PILATES_EMAIL }}
          PILATES_PASSWORD: ${{ secrets.PILATES_PASSWORD }}
          # Manual runs let you override; scheduled runs use the defaults.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          WAIT_FOR_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_release || 'true' }}
        run: python book_class.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
