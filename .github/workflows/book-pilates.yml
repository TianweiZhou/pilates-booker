name: Book Saturday Pilates class

on:
  # Superseded by the AWS Lambda + EventBridge Scheduler setup (see
  # README.md "Running on AWS") — GitHub's free-tier cron fired 60-90+
  # minutes late too often to be reliable for a class that fills in ~1
  # minute. Kept here, manual-trigger only, as an emergency fallback if
  # the AWS side ever has an outage.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (stop before the final booking click)"
        type: boolean
        default: true
      wait_for_release:
        description: "Wait for Thursday 11:00 ET before booking"
        type: boolean
        default: false

concurrency:
  group: book-pilates
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Book the class
        env:
          PILATES_EMAIL: ${{ secrets.PILATES_EMAIL }}
          PILATES_PASSWORD: ${{ secrets.PILATES_PASSWORD }}
          # Manual runs let you override; scheduled runs use the defaults.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          WAIT_FOR_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.wait_for_release || 'true' }}
        run: python book_class.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
