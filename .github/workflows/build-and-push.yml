name: Build and push Lambda image to ECR

# Builds the Playwright/Lambda container image and pushes it to ECR
# whenever the image-relevant files change on main, or on demand.
# Uses OIDC to assume an AWS role — no AWS keys stored in GitHub at all.
on:
  push:
    branches: [main]
    paths:
      - "book_class.py"
      - "lambda_handler.py"
      - "requirements-lambda.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read
  issues: write     # to open an issue if the build or deploy fails

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: pilates-booker
  AWS_ACCOUNT_ID: "329638939035"
  LAMBDA_FUNCTION_NAME: pilates-booker

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-pilates-booker
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Lambda only accepts a single-platform, single-manifest image.
          # Newer Docker defaults to an OCI image index with provenance/SBOM
          # attestation entries, which Lambda rejects ("image manifest ...
          # media type ... is not supported"), so turn those off and push
          # Docker v2 media types directly.
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --sbom=false \
            --output "type=image,\"name=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG,$ECR_REGISTRY/$ECR_REPOSITORY:latest\",push=true,oci-mediatypes=false" \
            .

      - name: Deploy new image to Lambda
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Point Lambda at the immutable git-SHA tag, not the mutable
          # :latest tag — avoids any ambiguity about which exact image
          # Lambda ends up running.
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --region "$AWS_REGION" >/dev/null
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Summary
        run: |
          {
            echo "Pushed: $ECR_REPOSITORY:${{ github.sha }} and :latest"
            echo "Deployed to Lambda function: $LAMBDA_FUNCTION_NAME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the build or deploy failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Build/deploy failed — $(date -u +%Y-%m-%d)"
          body="The **${{ github.workflow }}** run for commit \`${{ github.sha }}\` failed, so Lambda is still running the previous image.

          Run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh label create deploy-failure --repo "${{ github.repository }}" --color B60205 2>/dev/null || true
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" --label deploy-failure
          fi
